<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Gibson-Gamache — Digital Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bezel: #050505;
    --screen: #d9d9d9;
    --screen-edge: #b9b9b9;
    --dot: rgba(0, 0, 0, 0.13);
    --pill-bg: #111;
    --pill-fg: #f2f2f2;
    --chip-bg: #f2f2f2;
    --chip-fg: #111;
    --plastic: #3a3a3c;
    --plastic-hi: #545457;
    --plastic-lo: #232325;
    --accent: #7ef29a;
    --sheet-bg: rgba(250, 250, 250, 0.96);
    --sheet-fg: #111;
    --muted: #6b6b6b;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Manrope", system-ui, -apple-system, sans-serif;
    --cart-w: clamp(150px, 30vw, 300px);
  }
  [data-screen="dark"] {
    --screen: #1c1c1e;
    --screen-edge: #0f0f10;
    --dot: rgba(255, 255, 255, 0.09);
    --pill-bg: #f2f2f2;
    --pill-fg: #111;
    --chip-bg: #2c2c2e;
    --chip-fg: #f2f2f2;
    --sheet-bg: rgba(28, 28, 30, 0.97);
    --sheet-fg: #f2f2f2;
    --muted: #9a9a9a;
    --plastic: #4a4a4e;
    --plastic-hi: #6a6a6f;
    --plastic-lo: #333336;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bezel);
    color: var(--chip-fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: grid; place-items: center;
    padding: clamp(8px, 2.5vw, 28px);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- Screen ---------- */
  .screen {
    position: relative;
    width: 100%; height: 100%;
    max-width: 1400px; max-height: 860px;
    border-radius: clamp(14px, 2.4vw, 28px);
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 40%, var(--screen-edge) 120%),
      radial-gradient(var(--dot) 1.2px, transparent 1.6px) 0 0 / 18px 18px,
      var(--screen);
    display: grid;
    grid-template-rows: auto 1fr auto;
    transition: background-color .4s;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- Pills ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 12px;
    border-radius: 7px;
    background: var(--pill-bg); color: var(--pill-fg);
    font-size: 13px; font-weight: 500; letter-spacing: .02em;
    white-space: nowrap;
  }
  .key {
    display: inline-grid; place-items: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--pill-fg); color: var(--pill-bg);
    font-size: 10px; font-weight: 600;
  }

  /* ---------- Top bar ---------- */
  .top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: clamp(10px, 1.6vw, 18px) clamp(10px, 1.6vw, 18px) 0;
    gap: 8px;
  }
  .top .left { justify-self: start; }
  .top .right { justify-self: end; }
  .system { padding: 0 14px; }
  .system .name { min-width: 0; }
  .battery { display: inline-flex; align-items: center; gap: 6px; }
  .battery svg { display: block; }

  /* ---------- Carousel ---------- */
  .stage {
    position: relative;
    display: grid; place-items: center;
    perspective: 1200px;
    touch-action: pan-y;
    min-height: 0;
  }
  .track { position: relative; width: 100%; height: 100%; }
  .slot {
    position: absolute; left: 50%; top: 44%;
    width: var(--cart-w);
    transform: translate(-50%, -50%);
    transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .45s, filter .45s;
    cursor: pointer;
    will-change: transform;
  }
  .slot[data-off="0"] { cursor: default; z-index: 3; }
  .slot[data-off="0"] .shell { animation: bob 4.5s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: rotateX(8deg) rotateY(-6deg) translateY(0); }
    50%      { transform: rotateX(4deg) rotateY(6deg) translateY(-6px); }
  }

  /* Cartridge — Game Boy Advance-style shell.
     The drop shadow lives on .shell because clip-path on .cart would cut it off. */
  .shell {
    transform-style: preserve-3d;
    filter: drop-shadow(0 18px 18px rgba(0,0,0,.32)) drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  .cart {
    position: relative;
    aspect-ratio: 1.62 / 1;
    background:
      radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.07), transparent 60%),
      linear-gradient(180deg, var(--plastic-hi), var(--plastic) 14%, var(--plastic) 70%, var(--plastic-lo));
    /* cut top-left corner, small step on the top-right shoulder, softened bottom corners */
    clip-path: polygon(
      6.5% 0, 93% 0, 93% 2.5%, 100% 9%,
      100% 96%, 98.5% 100%, 1.5% 100%, 0 96%,
      0 11%
    );
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.14),
      inset 0 -5px 0 rgba(0,0,0,.28);
  }
  .cart::before { /* raised grip band across the top */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 20%;
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 70%, rgba(0,0,0,.22));
    box-shadow: 0 1px 0 rgba(255,255,255,.06);
  }
  .cart::after { /* blank embossed plate on the grip, where the system wordmark would sit */
    content: ""; position: absolute; left: 32%; right: 32%; top: 6.5%; height: 7%;
    border-radius: 2px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.07);
  }
  .label {
    position: absolute; left: 6%; right: 6%; top: 25%; bottom: 10%;
    border-radius: 3px;
    overflow: hidden;
    background: var(--lbl, #222);
    /* recessed label well */
    box-shadow:
      0 0 0 2px rgba(0,0,0,.35),
      0 0 0 3px rgba(255,255,255,.06),
      inset 0 1px 2px rgba(0,0,0,.35);
    display: grid;
  }
  .label::after { /* subtle sheen on the sticker */
    content: ""; grid-area: 1/1; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 35%);
  }
  .label img { width: 100%; height: 100%; object-fit: cover; display: block; grid-area: 1/1; }
  .label .art {
    grid-area: 1/1;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 6% 6%;
    color: var(--lbl-fg, #fff);
    font-family: var(--sans);
  }
  .label .art .t { font-weight: 600; font-size: clamp(13px, 2.4vw, 26px); letter-spacing: -.02em; line-height: 1.05; }
  .label .art .s { font-family: var(--mono); font-size: clamp(8px, 1vw, 11px); opacity: .75; }
  .label .tag {
    grid-area: 1/1; align-self: end; justify-self: start;
    margin: 6%; padding: 2px 6px; border-radius: 3px;
    background: rgba(0,0,0,.65); color: #fff;
    font-size: clamp(8px, .9vw, 10px); letter-spacing: .04em;
  }

  .caption {
    position: absolute; left: 50%; top: calc(44% + var(--cart-w) * .43);
    transform: translateX(-50%);
    background: var(--chip-bg); color: var(--chip-fg);
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    transition: opacity .25s;
  }
  .caption .key { background: var(--chip-fg); color: var(--chip-bg); }
  .caption.swap { opacity: 0; }

  .dots {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--pill-bg); opacity: .2; transition: opacity .3s, width .3s; }
  .dots i.on { opacity: .8; width: 16px; border-radius: 3px; }

  /* ---------- Bottom bar ---------- */
  .bottom {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 clamp(10px, 1.6vw, 18px) clamp(10px, 1.6vw, 18px);
    gap: 8px;
  }
  .bottom .group { display: flex; gap: 8px; }
  .bottom button.pill:hover { filter: brightness(1.25); }
  [data-screen="dark"] .bottom button.pill:hover { filter: brightness(.9); }

  /* ---------- Sheet (Inspect / About / Contact) ---------- */
  .sheet {
    position: absolute; inset: auto 0 0 0; z-index: 10;
    max-height: 78%;
    overflow: auto;
    background: var(--sheet-bg); color: var(--sheet-fg);
    border-radius: 16px 16px 0 0;
    padding: 28px clamp(18px, 4vw, 48px) 32px;
    transform: translateY(105%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    font-family: var(--sans);
    box-shadow: 0 -20px 60px rgba(0,0,0,.25);
  }
  .sheet.open { transform: none; }
  .sheet .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .03em; margin-bottom: 10px; }
  .sheet h2 { font-weight: 500; font-size: clamp(26px, 4vw, 44px); letter-spacing: -.035em; line-height: 1.05; margin-bottom: 14px; }
  .sheet p { font-size: 16px; line-height: 1.55; max-width: 62ch; color: var(--sheet-fg); opacity: .85; }
  .sheet p + p { margin-top: 10px; }
  .sheet .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .actions a, .sheet .actions button { font-family: var(--mono); }
  .scrim {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  /* ---------- Iris wipe on launch ---------- */
  .iris {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: #000;
    clip-path: circle(0% at 50% 50%);
  }
  .iris.closing {
    pointer-events: auto;
    animation: iris-close .7s cubic-bezier(.7,0,.3,1) forwards;
  }
  /* Inverse: black fills the screen except a shrinking hole */
  @keyframes iris-close {
    from { clip-path: circle(0% at var(--ix, 50%) var(--iy, 50%)); opacity: 1; }
    to   { clip-path: circle(150% at var(--ix, 50%) var(--iy, 50%)); opacity: 1; }
  }
  .iris.opening { animation: iris-open .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes iris-open {
    from { clip-path: circle(150% at 50% 50%); }
    to   { clip-path: circle(0% at 50% 50%); }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px) {
    :root { --cart-w: clamp(170px, 58vw, 260px); }
    body { padding: 0; }
    .screen { border-radius: 0; max-height: none; }
    .top { grid-template-columns: auto 1fr auto; }
    .system { justify-self: center; }
    .system .name .long { display: none; }
    .bottom .hide-sm { display: none; }
    .pill { height: 28px; font-size: 12px; padding: 0 10px; }
  }
  @media (min-width: 721px) { .system .name .short { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .slot, .sheet, .caption { transition: none; }
    .slot[data-off="0"] .shell { animation: none; }
    .iris { display: none; }
  }

  /* ---------- 3D layer ---------- */
  .gl-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity .5s;
  }
  .screen.gl .gl-canvas { opacity: 1; }
  .screen.gl .slot .shell { visibility: hidden; } /* slots stay as hitboxes + layout */
  .caption { z-index: 4; }

  /* ---------- Angle tuner (local-only admin panel) ---------- */
  .tuner {
    position: fixed; right: 16px; top: 64px; z-index: 60;
    width: 260px; padding: 14px;
    background: rgba(17,17,17,.92); color: #f2f2f2;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    font: 12px/1.4 var(--mono);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .tuner { max-height: calc(100vh - 80px); overflow-y: auto; overscroll-behavior: contain; }
  .tuner[hidden] { display: none; }
  .tuner section + section { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }
  .tuner h4 { font-size: 11px; font-weight: 500; opacity: .55; letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 8px; }
  .tuner label.colour { grid-template-columns: 1fr auto; align-items: center; }
  .tuner input[type=color] { width: 44px; height: 22px; padding: 0; border: 1px solid rgba(255,255,255,.25); border-radius: 5px; background: none; cursor: pointer; }
  .tuner .status { min-height: 1.4em; margin-top: 8px; font-size: 11px; opacity: .7; }
  .tuner .status.ok { color: #7ef29a; opacity: 1; }
  .tuner .status.err { color: #ff7a6e; opacity: 1; }
  .tuner h3 { font-size: 12px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .tuner h3 span { opacity: .5; font-weight: 400; }
  .tuner label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
  .tuner label small { opacity: .55; grid-column: 1 / -1; }
  .tuner input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: #7ef29a; }
  .tuner output { font-variant-numeric: tabular-nums; }
  .tuner .row { display: flex; gap: 6px; margin-top: 4px; }
  .tuner .row button {
    flex: 1; height: 28px; border-radius: 6px;
    background: #f2f2f2; color: #111; font-size: 12px; font-weight: 500;
  }
  .tuner .row button.ghost { background: transparent; color: #f2f2f2; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }

  /* ---------- Loading screen ----------
     3×3 squares, each fading between full and 20% on its own beat (1.5s loop).
     Grey ramp that blends into the accent toward the bottom-right corner. */
  .loader {
    --sq: clamp(10px, 1.3vw, 16px);
    --ld-grey: #5c5c60;
    --ld-accent: #2fb457; /* deeper green so it reads on the light screen */
    position: absolute; inset: 0; z-index: 40;
    display: grid; place-items: center;
    background: inherit;
    transition: opacity .45s ease, visibility 0s linear .45s;
  }
  [data-screen="dark"] .loader { --ld-grey: #8e8e93; --ld-accent: var(--accent); }
  .loader.done { opacity: 0; visibility: hidden; }
  .loader .grid {
    display: grid; grid-template-columns: repeat(3, var(--sq)); gap: var(--sq);
  }
  .loader i {
    width: var(--sq); height: var(--sq);
    background: color-mix(in oklab, var(--ld-accent) var(--mix), var(--ld-grey));
    animation: 1.5s linear infinite;
  }
  .loader i:nth-child(1) { --mix: 0%;   animation-name: ld-a; }
  .loader i:nth-child(2) { --mix: 12%;  animation-name: ld-b; }
  .loader i:nth-child(3) { --mix: 30%;  animation-name: ld-c; }
  .loader i:nth-child(4) { --mix: 12%;  animation-name: ld-c; }
  .loader i:nth-child(5) { --mix: 30%;  animation-name: ld-d; }
  .loader i:nth-child(6) { --mix: 58%;  animation-name: ld-e; }
  .loader i:nth-child(7) { --mix: 30%;  animation-name: ld-e; }
  .loader i:nth-child(8) { --mix: 58%;  animation-name: ld-a; }
  .loader i:nth-child(9) { --mix: 100%; animation-name: ld-b; }
  @keyframes ld-a { 0%, 40% { opacity: 1; } 80% { opacity: .2; } 100% { opacity: 1; } }
  @keyframes ld-b { 0% { opacity: 1; } 40% { opacity: .2; } 60%, 100% { opacity: 1; } }
  @keyframes ld-c { 0% { opacity: .2; } 20% { opacity: 1; } 60%, 100% { opacity: .2; } }
  @keyframes ld-d { 0% { opacity: 1; } 20% { opacity: .2; } 60%, 100% { opacity: 1; } }
  @keyframes ld-e { 0%, 20% { opacity: 1; } 60% { opacity: .2; } 80%, 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .loader i { animation-duration: 4.5s; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<main class="screen" id="screen" data-screen="light" aria-roledescription="launcher">
  <h1 class="sr-only">Thomas Gibson-Gamache — digital designer. Selected works.</h1>

  <div class="loader" id="loader" role="status">
    <div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="sr-only">Loading</span>
  </div>
  <script>
    // Apply the saved screen theme before first paint so the loader doesn't flash light.
    try {
      const t = localStorage.getItem("screen") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.getElementById("screen").dataset.screen = t;
    } catch (e) {}
    // Hide the loader once the 3D cartridges are up (or failed); never hang longer than 10s.
    window.hideLoader = () => document.getElementById("loader")?.classList.add("done");
    setTimeout(window.hideLoader, 10000);
  </script>

  <!-- Top bar -->
  <header class="top">
    <span class="pill left" id="clock" aria-label="Current time">--:--</span>
    <div class="pill system">
      <span class="name"><span class="long">Thomas Gibson-Gamache</span><span class="short">TGG</span></span>
    </div>
    <span class="pill right battery" aria-label="Battery full">
      100%
      <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
        <path d="M9 11.2 1 3.6a11.3 11.3 0 0 1 16 0Z" fill="currentColor"/>
      </svg>
    </span>
  </header>

  <!-- Carousel -->
  <section class="stage" id="stage" aria-label="Selected works">
    <div class="track" id="track"></div>
    <canvas class="gl-canvas" id="gl" aria-hidden="true"></canvas>
    <div class="pill caption" id="caption" aria-live="polite"><span class="key">A</span><span id="caption-text"></span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <!-- Bottom bar -->
  <footer class="bottom">
    <div class="group">
      <button class="pill" id="btn-theme"><span class="key">Y</span><span id="theme-label">Dark screen</span></button>
    </div>
    <div class="group">
      <button class="pill" id="btn-about"><span class="key">X</span>About</button>
      <button class="pill" id="btn-inspect"><span class="key">B</span>Inspect</button>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="meta" id="sheet-meta"></div>
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
    <div class="actions" id="sheet-actions"></div>
  </aside>
</main>

<div class="iris" id="iris"></div>

<script>
  /* ---------- Content ----------
     Cartridge names, colours and details live in cartridges.json.
     Edit them in admin.html (run `node server.js` to save from that page). */
  async function loadCartridges() {
    try {
      const res = await fetch("cartridges.json", { cache: "no-store" });
      return (await res.json()).cartridges || [];
    } catch (e) {
      console.warn("Couldn't load cartridges.json — open the site through a local server, not as a file.", e);
      return [];
    }
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const labelBg = (p) => {
    const c = p.label?.colors?.length ? p.label.colors : ["#222222"];
    return c.length > 1 ? `linear-gradient(135deg,${c.join(",")})` : c[0];
  };

  window.LAUNCHER_READY = (async () => {
  const PROJECTS = await loadCartridges();

  const LINKS = {
    linkedin: "https://www.linkedin.com/in/tgibsongamache/",
    instagram: "https://www.instagram.com/gigi.psd",
  };

  /* ---------- Setup ---------- */
  const $ = (id) => document.getElementById(id);
  const screen = $("screen"), track = $("track"), caption = $("caption"), captionText = $("caption-text");
  const sheet = $("sheet"), scrim = $("scrim"), iris = $("iris");
  const N = PROJECTS.length;
  let index = 0;
  try { index = Math.min(N - 1, Math.max(0, +sessionStorage.getItem("cart") || 0)); } catch (e) {}

  const slots = PROJECTS.map((p, i) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.setAttribute("role", "button");
    slot.setAttribute("aria-label", p.title);
    const art = p.img
      ? `<img src="${esc(p.img)}" alt="" draggable="false"><span class="tag">${esc(p.category).toUpperCase()}</span>`
      : `<div class="art"><span class="s">${esc(p.year)} · ${esc(p.category)}</span><span class="t">${esc(p.title)}</span><span class="s">TGG</span></div>`;
    const lbl = p.label ? `style="--lbl:${labelBg(p)};--lbl-fg:${p.label.fg}"` : "";
    const shell = p.shell ? `style="--plastic:${p.shell};--plastic-hi:${p.shell};--plastic-lo:${p.shell}"` : "";
    slot.innerHTML = `<div class="shell"><div class="cart" ${shell}><div class="label" ${lbl}>${art}</div></div></div>`;
    slot.addEventListener("click", () => {
      const off = +slot.dataset.off;
      if (off === 0) launch(); else go(index + off);
    });
    track.appendChild(slot);
    return slot;
  });
  const dots = PROJECTS.map(() => { const d = document.createElement("i"); $("dots").appendChild(d); return d; });

  function offsetFor(i) {
    let o = i - index;
    if (o > N / 2) o -= N;
    if (o < -N / 2) o += N;
    return o;
  }

  function render() {
    const w = track.clientWidth;
    const cartW = slots[0].offsetWidth;
    const spread = Math.max(Math.min(w * 0.34, 420), cartW * 0.8);
    // Off-stage cartridges (|offset| ≥ 2) sit just past the side slots at scale 0,
    // so leaving shrinks them away and arriving grows them in (ease-out via .slot transition).
    const place = (o) => {
      const a = Math.abs(o);
      const x = a >= 2 ? Math.sign(o) * spread * 1.5 : o * spread;
      const scale = a === 0 ? 1 : a === 1 ? 0.6 : 0;
      const rotY = o === 0 ? 0 : o < 0 ? 18 : -18;
      return `translate(calc(-50% + ${x}px), -50%) scale(${scale}) rotateY(${rotY}deg)`;
    };
    slots.forEach((s, i) => {
      const o = offsetFor(i);
      const a = Math.abs(o);
      const prev = s.dataset.off === undefined ? o : +s.dataset.off;
      // Wrapping round to the other side: jump (invisibly, at scale 0) to that side's
      // off-stage spot first, so it never sweeps across the screen.
      if (Math.sign(prev) * Math.sign(o) < 0 && Math.abs(prev - o) > 1) {
        s.style.transition = "none";
        s.style.transform = place(Math.sign(o) * 2);
        s.offsetWidth; // commit the jump before re-enabling the transition
        s.style.transition = "";
      }
      s.dataset.off = o;
      s.style.transform = place(o);
      s.style.opacity = a === 0 ? 1 : 0.55;
      s.style.filter = a === 0 ? "none" : "saturate(.6) blur(.4px)";
      s.style.pointerEvents = a > 1 ? "none" : "auto";
      s.tabIndex = a === 0 ? 0 : -1;
    });
    dots.forEach((d, i) => d.classList.toggle("on", i === index));
    caption.classList.add("swap");
    setTimeout(() => { captionText.textContent = PROJECTS[index].title; caption.classList.remove("swap"); }, 140);
    try { sessionStorage.setItem("cart", index); } catch (e) {}
  }

  function go(i) {
    index = ((i % N) + N) % N;
    if (sheet.classList.contains("open")) inspect(); // keep sheet in sync
    render();
  }

  /* ---------- Launch: iris wipe, then open ---------- */
  function launch() {
    const p = PROJECTS[index];
    if (p.action === "about") return about();
    if (p.action === "contact") return contact();
    const dest = p.protected ? `locked.html?c=${encodeURIComponent(p.protected)}` : p.href;
    if (!dest) return inspect();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { location.href = dest; return; }
    const r = slots[index].getBoundingClientRect();
    iris.style.setProperty("--ix", `${r.left + r.width / 2}px`);
    iris.style.setProperty("--iy", `${r.top + r.height / 2}px`);
    iris.classList.remove("opening");
    iris.classList.add("closing");
    setTimeout(() => { location.href = dest; }, 680);
  }

  /* ---------- Sheets ---------- */
  function openSheet({ meta, title, body, actions }) {
    $("sheet-meta").textContent = meta;
    $("sheet-title").textContent = title;
    $("sheet-body").innerHTML = body;
    $("sheet-actions").innerHTML = actions || "";
    sheet.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add("open"); scrim.classList.add("open"); });
    sheet.dataset.kind = title;
  }
  function closeSheet() {
    if (!sheet.classList.contains("open")) return false;
    sheet.classList.remove("open"); scrim.classList.remove("open");
    setTimeout(() => { if (!sheet.classList.contains("open")) sheet.hidden = true; }, 450);
    return true;
  }
  const linkPill = (href, text, key) =>
    `<a class="pill" href="${href}" target="_blank" rel="noopener">${key ? `<span class="key">${key}</span>` : ""}${text} ↗</a>`;

  function inspect() {
    const p = PROJECTS[index];
    if (p.action === "about") return about();
    if (p.action === "contact") return contact();
    openSheet({
      meta: `${p.year} · ${p.category}${p.protected ? " · 🔒 Password protected" : ""}`,
      title: p.title,
      body: `${p.summary ? `<p>${esc(p.summary)}</p>` : ""}${p.role ? `<p style="font-family:var(--mono);font-size:13px;opacity:.6">${esc(p.role)}</p>` : ""}`,
      actions: p.protected
        ? `<button class="pill" data-launch><span class="key">A</span>Unlock case study</button>`
        : p.href
          ? `<button class="pill" data-launch><span class="key">A</span>Open case study</button>`
          : `<span class="pill" style="opacity:.5">Case study coming soon</span>`,
    });
  }
  function about() {
    openSheet({
      meta: "Profile",
      title: "Hi, I'm Thomas — a digital designer focused on brand, design systems, and thoughtful experiences.",
      body: `<p>I bring a systems-driven, craft-focused approach to digital design, shaped by a background in industrial and footwear design and freelance work with startups and small teams.</p>
             <p>My practice spans brand and visual design, design systems, interaction design, accessibility, and user research.</p>`,
      actions: linkPill(LINKS.linkedin, "Experience on LinkedIn")
        + `<p style="width:100%;margin-top:14px;font-family:var(--mono);font-size:11px;opacity:.55">3D cartridge model by WandererTJ (GrabCAD).</p>`,
    });
  }
  function contact() {
    openSheet({
      meta: "Contact",
      title: "Let's chat!",
      body: `<p>Say hello — I'm always up for talking design, systems, or a new project.</p>`,
      actions: linkPill(LINKS.linkedin, "LinkedIn") + linkPill(LINKS.instagram, "Instagram"),
    });
  }
  sheet.addEventListener("click", (e) => { if (e.target.closest("[data-launch]")) { closeSheet(); launch(); } });
  scrim.addEventListener("click", closeSheet);

  /* ---------- Theme ---------- */
  function setTheme(t) {
    screen.dataset.screen = t;
    $("theme-label").textContent = t === "light" ? "Dark screen" : "Light screen";
    try { localStorage.setItem("screen", t); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem("screen"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  /* ---------- Controls ---------- */
  $("btn-theme").onclick = () => setTheme(screen.dataset.screen === "light" ? "dark" : "light");
  $("btn-about").onclick = about;
  $("btn-inspect").onclick = () => (sheet.classList.contains("open") ? closeSheet() : inspect());
  caption.style.cursor = "pointer";
  caption.onclick = launch;

  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "q" || k === "l") go(index - 1);
    else if (k === "arrowright" || k === "e" || k === "r") go(index + 1);
    else if (k === "enter" || k === " " || k === "a") { e.preventDefault(); closeSheet(); launch(); }
    else if (k === "escape" || k === "b") { if (!closeSheet() && k === "b") inspect(); }
    else if (k === "i" || k === "arrowup") inspect();
    else if (k === "arrowdown") closeSheet();
    else if (k === "x") about();
    else if (k === "y") $("btn-theme").click();
  });

  // Swipe
  let sx = null;
  $("stage").addEventListener("pointerdown", (e) => { sx = e.clientX; });
  addEventListener("pointerup", (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(index + (dx < 0 ? 1 : -1));
  });
  // Trackpad / wheel (horizontal or vertical), throttled
  let wheelLock = 0;
  $("stage").addEventListener("wheel", (e) => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(d) < 12 || Date.now() < wheelLock) return;
    wheelLock = Date.now() + 450;
    go(index + (d > 0 ? 1 : -1));
  }, { passive: true });

  // Clock
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toUpperCase();
  }
  tick(); setInterval(tick, 15000);

  // Returning from a case study (bfcache): reverse the wipe
  addEventListener("pageshow", () => {
    if (iris.classList.contains("closing")) {
      iris.classList.remove("closing");
      iris.classList.add("opening");
    }
  });

  addEventListener("resize", render);
  render();
  return { PROJECTS, slots };
  })();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
  /* ---------- 3D cartridges ----------
     The DOM .slot elements keep doing layout, transitions, clicks and a11y.
     Each frame we read where each slot is and place a 3D cartridge there. */
  import * as THREE from "three";
  import { STLLoader } from "three/addons/loaders/STLLoader.js";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
  import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

  const { PROJECTS, slots } = await window.LAUNCHER_READY;
  const screenEl = document.getElementById("screen");
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("gl");
  const track = document.getElementById("track");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Model facts (mm, from the STL): body 60 × 34.4 × 9.3, front face +Z.
  const MODEL_W = 60;
  const LABEL = { w: 42.6, h: 21.4, cx: 30.1, cy: 15.4, z: 7.68 }; // label well floor is 7.56; sit just above the 7.62 rim to avoid z-fighting
  const LABEL_ASPECT = LABEL.w / LABEL.h;
  // Resting angle (radians): x tips the top away, y turns the right side toward you, z rolls clockwise
  const DEFAULT_POSE = { x: -0.5, y: -0.08, z: -0.36 };
  const POSE = { ...DEFAULT_POSE };

  // Lighting: defaults below, overridden by lighting.json (saved from the tuner panel).
  // Angles are degrees: azimuth 0 = straight in front, + = from the right; elevation + = from above.
  const DEFAULT_LIGHT = {
    exposure: 1.05, env: 1,
    keyIntensity: 1.4, keyColor: "#ffffff", keyAz: -18, keyEl: 38,
    fillIntensity: 0, fillColor: "#9bb8ff", fillAz: 150, fillEl: 20,
    ambientIntensity: 0.25, ambientColor: "#ffffff",
  };
  const LIGHT = { ...DEFAULT_LIGHT, ...(await loadLighting()) };
  let applyLighting = () => {}; // replaced once the scene exists
  const tunerPanel = setupTuner(POSE, DEFAULT_POSE);
  if (tunerPanel) setupLightTuner(tunerPanel, LIGHT, DEFAULT_LIGHT, () => applyLighting());

  async function loadLighting() {
    try {
      const res = await fetch("lighting.json", { cache: "no-store" });
      return res.ok ? await res.json() : {};
    } catch (e) { return {}; }
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) { console.warn("WebGL unavailable, keeping CSS cartridges", e); }

  if (renderer) init().catch((e) => console.warn("3D cartridges failed, keeping CSS ones", e)).finally(window.hideLoader);
  else window.hideLoader();

  async function init() {
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const key = new THREE.DirectionalLight();
    const fill = new THREE.DirectionalLight();
    const ambient = new THREE.AmbientLight();
    scene.add(key, fill, ambient);

    const FOV = 30;
    const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 20000);

    // Geometry: load once, smooth curved surfaces but keep hard edges crisp.
    let geo = await new STLLoader().loadAsync("models/gba-cartridge.stl");
    geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(35));
    geo.computeBoundingBox();
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    geo.translate(-c.x, -c.y, -c.z);

    const labelGeo = new THREE.PlaneGeometry(LABEL.w, LABEL.h);
    // Fonts for label text; don't block forever (background tabs can stall this)
    await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);

    const carts = await Promise.all(PROJECTS.map(async (p) => {
      const plastic = new THREE.MeshPhysicalMaterial({
        color: 0x3b3b3e, roughness: 0.5, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.6,
      });
      const tex = new THREE.CanvasTexture(await drawLabel(p));
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const sticker = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.42, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });

      const group = new THREE.Group();
      const body = new THREE.Mesh(geo, plastic);
      const label = new THREE.Mesh(labelGeo, sticker);
      label.position.set(LABEL.cx - c.x, LABEL.cy - c.y, LABEL.z - c.z);
      group.add(body, label);
      scene.add(group);
      const shell = p.shell ? new THREE.Color(p.shell) : null; // null = theme default grey
      return { group, plastic, sticker, shell, rotX: POSE.x, rotY: POSE.y, rotZ: POSE.z };
    }));

    const place = (light, az, el) => {
      const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
      light.position.set(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
    };
    applyLighting = () => {
      const L = LIGHT;
      renderer.toneMappingExposure = L.exposure;
      key.intensity = L.keyIntensity; key.color.set(L.keyColor); place(key, L.keyAz, L.keyEl);
      fill.intensity = L.fillIntensity; fill.color.set(L.fillColor); place(fill, L.fillAz, L.fillEl);
      fill.visible = L.fillIntensity > 0;
      ambient.intensity = L.ambientIntensity; ambient.color.set(L.ambientColor);
      carts.forEach((cart) => { cart.plastic.envMapIntensity = L.env; cart.sticker.envMapIntensity = L.env; });
    };
    applyLighting();

    let W = 0, H = 0;
    function resize() {
      const r = stage.getBoundingClientRect();
      W = r.width; H = r.height;
      renderer.setSize(W, H, false);
      camera.aspect = W / H;
      // 1 world unit == 1 CSS pixel on the z=0 plane
      camera.position.set(0, 0, (H / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2)));
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    const clock = new THREE.Clock();
    const PLASTIC = { light: new THREE.Color(0x3b3b3e), dark: new THREE.Color(0x505054) };
    const bg = new THREE.Color(), base = new THREE.Color();
    function frame() {
      const t = clock.getElapsedTime();
      const theme = screenEl.dataset.screen === "dark" ? "dark" : "light";
      bg.set(getComputedStyle(screenEl).getPropertyValue("--screen").trim() || "#d9d9d9");

      carts.forEach((cart, i) => {
        const slot = slots[i];
        const off = +slot.dataset.off;
        const op = +getComputedStyle(slot).opacity;
        cart.group.visible = op > 0.01;
        if (!cart.group.visible) return;

        // Read the slot's live (mid-transition) transform rather than its bounding box,
        // which grows when the slot is angled in perspective.
        const m = new DOMMatrix(getComputedStyle(slot).transform);
        const s = Math.hypot(m.m11, m.m12, m.m13); // current CSS scale
        const px = slot.offsetWidth * s;
        const cx = track.offsetLeft + slot.offsetLeft + slot.offsetWidth / 2 + m.m41;
        const cy = track.offsetTop + slot.offsetTop + slot.offsetHeight / 2 + m.m42;
        cart.group.position.set(cx - W / 2, H / 2 - cy, off === 0 ? 40 : 0);
        cart.group.scale.setScalar(px / MODEL_W);

        // Target pose: lying back and rolled clockwise, like a product shot from above.
        // Centre floats on an idle loop; sides turn slightly inward.
        let tx = POSE.x, ty = POSE.y + (off === 0 ? 0 : off < 0 ? 0.3 : -0.3), tz = POSE.z;
        if (off === 0 && !reduce) {
          tx += Math.sin(t * 1.3) * 0.04;
          ty += Math.sin(t * 0.8) * 0.08;
          cart.group.position.y += Math.sin(t * 1.4) * 4;
        }
        cart.rotX += (tx - cart.rotX) * 0.1;
        cart.rotY += (ty - cart.rotY) * 0.1;
        cart.rotZ += (tz - cart.rotZ) * 0.1;
        cart.group.rotation.set(cart.rotX, cart.rotY, cart.rotZ);

        // Side cartridges stay solid and wash out toward the screen colour
        // (real transparency would show the model's insides).
        const f = Math.min(1, (1 - op) * 1.25);
        base.copy(cart.shell || PLASTIC[theme]);
        cart.plastic.color.copy(base).multiplyScalar(1 - f);
        cart.plastic.emissive.copy(bg).multiplyScalar(f * 0.9);
        cart.sticker.color.setScalar(1 - f);
        cart.sticker.emissive.copy(bg).multiplyScalar(f * 0.9);
        cart.group.visible = s > 0.01; // off-stage carts shrink to nothing rather than fading
      });

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
    screenEl.classList.add("gl");
  }

  /* ---------- Label art (drawn to a canvas, used as the sticker texture) ---------- */
  async function drawLabel(p) {
    const W = 1024, H = Math.round(W / LABEL_ASPECT);
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");

    if (p.img) {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = p.img; });
      const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      g.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
      // category tag
      const tag = p.category.toUpperCase();
      g.font = "500 30px 'JetBrains Mono'";
      const tw = g.measureText(tag).width;
      g.fillStyle = "rgba(0,0,0,.65)";
      roundRect(g, 36, H - 36 - 54, tw + 36, 54, 8); g.fill();
      g.fillStyle = "#fff"; g.textBaseline = "middle";
      g.fillText(tag, 54, H - 36 - 27);
      return cv;
    }

    // Background: solid colour or the hex stops of a CSS linear-gradient
    const stops = p.label?.colors?.length ? p.label.colors : ["#222222"];
    if (stops.length > 1) {
      const grad = g.createLinearGradient(0, 0, W, H);
      stops.forEach((col, i) => grad.addColorStop(i / (stops.length - 1), col));
      g.fillStyle = grad;
    } else g.fillStyle = stops[0];
    g.fillRect(0, 0, W, H);

    const fg = p.label?.fg || "#fff";
    g.fillStyle = fg; g.textBaseline = "alphabetic";
    g.globalAlpha = 0.75;
    g.font = "500 30px 'JetBrains Mono'";
    g.fillText(`${p.year} · ${p.category}`, 56, 84);
    g.fillText("TGG", 56, H - 52);
    g.globalAlpha = 1;
    g.font = "600 110px Manrope";
    g.fillText(p.title, 52, H / 2 + 40);
    return cv;
  }
  /* ---------- Angle tuner ----------
     Admin-only: it exists only when the site is served from this computer
     (localhost / 127.0.0.1), so visitors to the published site never get it.
     Toggle with the ` (backtick) key. Tweaks are remembered in this browser;
     "Copy values" gives you the line to paste over DEFAULT_POSE to make it permanent. */
  function setupTuner(pose, defaults) {
    const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    if (!local) return;

    const KEY = "socket:pose";
    try { Object.assign(pose, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pose)); } catch (e) {} };

    const axes = [
      ["x", "Tilt", "top away ↔ toward you"],
      ["y", "Turn", "left ↔ right side toward you"],
      ["z", "Roll", "clockwise ↔ counter-clockwise"],
    ];
    const deg = (r) => `${Math.round(THREE.MathUtils.radToDeg(r))}°`;
    const panel = document.createElement("aside");
    panel.className = "tuner";
    panel.hidden = true;
    panel.setAttribute("aria-label", "Cartridge angle tuner");
    panel.innerHTML = `
      <h3>Cartridge angle <span>\` to hide</span></h3>
      ${axes.map(([k, name, hint]) => `
        <label>${name} <output data-out="${k}"></output>
          <small>${hint}</small>
          <input type="range" data-axis="${k}" min="-1.57" max="1.57" step="0.01">
        </label>`).join("")}
      <div class="row">
        <button type="button" data-act="copy">Copy values</button>
        <button type="button" class="ghost" data-act="reset">Reset</button>
      </div>`;
    document.body.appendChild(panel);

    const sync = () => axes.forEach(([k]) => {
      panel.querySelector(`[data-axis="${k}"]`).value = pose[k];
      panel.querySelector(`[data-out="${k}"]`).textContent = `${pose[k].toFixed(2)} (${deg(pose[k])})`;
    });
    sync();

    panel.addEventListener("input", (e) => {
      const k = e.target.dataset.axis;
      if (!k) return;
      pose[k] = +e.target.value;
      sync(); save();
    });
    panel.addEventListener("click", async (e) => {
      const act = e.target.dataset.act;
      if (act === "reset") { Object.assign(pose, defaults); sync(); save(); }
      if (act === "copy") {
        const line = `const DEFAULT_POSE = { x: ${pose.x.toFixed(2)}, y: ${pose.y.toFixed(2)}, z: ${pose.z.toFixed(2)} };`;
        try { await navigator.clipboard.writeText(line); e.target.textContent = "Copied!"; }
        catch { prompt("Copy this line:", line); }
        setTimeout(() => (e.target.textContent = "Copy values"), 1200);
      }
    });
    // Keep the launcher's keyboard shortcuts from firing while you use the panel
    panel.addEventListener("keydown", (e) => e.stopPropagation());

    addEventListener("keydown", (e) => {
      if (e.key === "`" && !e.metaKey && !e.ctrlKey) panel.hidden = !panel.hidden;
    });
    return panel;
  }

  /* ---------- Lighting tuner ----------
     Lives in the same local-only panel. Changes preview live; "Save lighting"
     writes lighting.json through server.js (/api/commit), so it sticks for everyone. */
  function setupLightTuner(panel, light, defaults, apply) {
    let saved = { ...light };
    const sliders = {
      "Overall": [
        ["exposure", "Exposure", 0.2, 2.5, 0.01],
        ["env", "Reflections", 0, 3, 0.01, "studio environment strength"],
      ],
      "Key light": [
        ["keyIntensity", "Brightness", 0, 6, 0.05],
        ["keyColor", "Colour"],
        ["keyAz", "Direction", -180, 180, 1, "left ↔ right (0 = front)", "°"],
        ["keyEl", "Height", -90, 90, 1, "below ↔ above", "°"],
      ],
      "Fill / rim light": [
        ["fillIntensity", "Brightness", 0, 6, 0.05, "0 = off"],
        ["fillColor", "Colour"],
        ["fillAz", "Direction", -180, 180, 1, "±180 = from behind", "°"],
        ["fillEl", "Height", -90, 90, 1, "", "°"],
      ],
      "Ambient": [
        ["ambientIntensity", "Brightness", 0, 2, 0.01],
        ["ambientColor", "Colour"],
      ],
    };
    const ctl = ([k, name, min, max, step, hint, unit = ""]) => min == null
      ? `<label class="colour">${name} <input type="color" data-light="${k}"></label>`
      : `<label>${name} <output data-light-out="${k}" data-unit="${unit}"></output>
           ${hint ? `<small>${hint}</small>` : ""}
           <input type="range" data-light="${k}" min="${min}" max="${max}" step="${step}">
         </label>`;
    const sec = document.createElement("section");
    sec.innerHTML = `
      <h3>Lighting</h3>
      ${Object.entries(sliders).map(([g, list]) => `<h4>${g}</h4>${list.map(ctl).join("")}`).join("")}
      <div class="row">
        <button type="button" data-light-act="save">Save lighting</button>
        <button type="button" class="ghost" data-light-act="revert">Revert</button>
        <button type="button" class="ghost" data-light-act="defaults">Defaults</button>
      </div>
      <p class="status" aria-live="polite"></p>`;
    const first = document.createElement("section");
    while (panel.firstChild) first.appendChild(panel.firstChild);
    panel.append(first, sec);
    panel.setAttribute("aria-label", "Cartridge angle and lighting tuner");

    const status = sec.querySelector(".status");
    const say = (msg, kind = "") => { status.textContent = msg; status.className = "status " + kind; };
    const dirty = () => JSON.stringify(light) !== JSON.stringify(saved);
    const sync = () => {
      sec.querySelectorAll("[data-light]").forEach((el) => (el.value = light[el.dataset.light]));
      sec.querySelectorAll("[data-light-out]").forEach((el) => {
        const v = light[el.dataset.lightOut];
        el.textContent = (el.dataset.unit ? Math.round(v) : v.toFixed(2)) + el.dataset.unit;
      });
      sec.querySelector('[data-light-act="save"]').disabled = !dirty();
    };
    sync();

    sec.addEventListener("input", (e) => {
      const k = e.target.dataset.light;
      if (!k) return;
      light[k] = e.target.type === "range" ? +e.target.value : e.target.value;
      apply(); sync(); say(dirty() ? "Unsaved changes" : "");
    });
    sec.addEventListener("click", async (e) => {
      const act = e.target.dataset.lightAct;
      if (act === "revert") { Object.assign(light, saved); apply(); sync(); say("Back to last save"); }
      if (act === "defaults") { Object.assign(light, defaults); apply(); sync(); say(dirty() ? "Defaults — not saved yet" : ""); }
      if (act === "save") {
        e.target.disabled = true; say("Saving…");
        try {
          const json = JSON.stringify(light, null, 2) + "\n";
          const res = await fetch("/api/commit", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ files: [{ path: "lighting.json", content: btoa(json) }] }),
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(out.error || `HTTP ${res.status} — is node server.js running?`);
          saved = { ...light }; sync(); say("Saved to lighting.json", "ok");
        } catch (err) { sync(); say(err.message, "err"); }
      }
    });
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
</script>
</body>
</html>
